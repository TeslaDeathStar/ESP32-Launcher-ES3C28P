; LCDWiki 2.8inch ESP32-S3 Display, touch model ES3C28P
; https://www.lcdwiki.com/2.8inch_ESP32-S3_Display

[env:ES3C28P]
board = es3c28p
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/es3c28p>
build_flags =
	${env.build_flags}
	-Iboards/es3c28p
	-DDEVICE_NAME='"ES3C28P"'
	-DOTA_TAG='"ES3C28P"'
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_OTA
	-DDONT_USE_INPUT_TASK=1

	; Launcher controls
	-DROTATION=1
	-DHAS_BTN=0
	-DSEL_BTN=-1
	-DUP_BTN=-1
	-DDW_BTN=-1
	-DBTN_ACT=LOW
	-DBTN_ALIAS='"Sel"'
	-DMINBRIGHT=20

	; LCDWiki ES3C28P: ILI9341V, 240x320, 4-wire SPI
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_SCLK=12
	-DTFT_MOSI=11
	-DTFT_MISO=13
	-DTFT_RST=-1
	-DTFT_BL=45
	-DGFX_BL=45
	-DTFT_IPS=1
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0

	; FT6336G capacitive touch over I2C
	-DTOUCH_FT6336=1
	-DTOUCH_SDA=16
	-DTOUCH_SCL=15
	-DTOUCH_RST=18
	-DTOUCH_INT=17

	; MicroSD: SDIO bus. The shared loader path mounts SD_MMC in one-bit mode,
	; using CLK/CMD/D0.
	-DBOARD_HAS_TF=1
	-DUSE_SD_MMC=1
	-DPIN_SD_CLK=38
	-DPIN_SD_CMD=40
	-DPIN_SD_D0=39
	-DSDCARD_CS=-1
	-DSDCARD_SCK=PIN_SD_CLK
	-DSDCARD_MISO=PIN_SD_D0
	-DSDCARD_MOSI=PIN_SD_CMD

	; Backlight PWM
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

lib_ignore =
	SensorLib
	XPowersLib

lib_deps =
	bblanchon/ArduinoJson
	moononournation/GFX Library for Arduino
